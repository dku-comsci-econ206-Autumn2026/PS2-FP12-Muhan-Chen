<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 250" role="img" aria-labelledby="title desc">
  <title id="title">Three unique equilibria</title>
  <desc id="desc">Aligned card: Trust and Keep, payoffs 6 and 6. Misaligned card without a forfeit: Verify and Break, payoffs 2 and 10. Misaligned card with a forfeit of 5: Trust and Keep, payoffs 6 and 6.</desc>
  <rect width="980" height="250" fill="#F5F7FA"/>
  <g font-family="Georgia, serif" fill="#111111">
    <g>
      <rect x="20" y="20" width="300" height="210" rx="10" fill="#FFFFFF" stroke="#0072B2" stroke-width="2"/>
      <text x="170" y="52" text-anchor="middle" font-size="16" font-weight="700">Aligned, no forfeit</text>
      <text x="170" y="96" text-anchor="middle" font-size="22" font-weight="700">Trust, Keep</text>
      <text x="170" y="128" text-anchor="middle" font-size="16">Payoffs 6 and 6</text>
      <text x="170" y="168" text-anchor="middle" font-size="14">Break pays 3, so Keep is better</text>
      <text x="170" y="196" text-anchor="middle" font-size="14">Verify pays the Decider 2</text>
    </g>
    <g>
      <rect x="340" y="20" width="300" height="210" rx="10" fill="#FFFFFF" stroke="#CC79A7" stroke-width="2"/>
      <text x="490" y="52" text-anchor="middle" font-size="16" font-weight="700">Misaligned, no forfeit</text>
      <text x="490" y="96" text-anchor="middle" font-size="22" font-weight="700">Verify, Break</text>
      <text x="490" y="128" text-anchor="middle" font-size="16">Payoffs 2 and 10</text>
      <text x="490" y="168" text-anchor="middle" font-size="14">Break pays 10, so Break is better</text>
      <text x="490" y="196" text-anchor="middle" font-size="14">Trust against Break pays 4</text>
    </g>
    <g>
      <rect x="660" y="20" width="300" height="210" rx="10" fill="#FFFFFF" stroke="#E69F00" stroke-width="2"/>
      <text x="810" y="52" text-anchor="middle" font-size="16" font-weight="700">Misaligned, forfeit 5</text>
      <text x="810" y="96" text-anchor="middle" font-size="22" font-weight="700">Trust, Keep</text>
      <text x="810" y="128" text-anchor="middle" font-size="16">Payoffs 6 and 6</text>
      <text x="810" y="168" text-anchor="middle" font-size="14">Break pays 5, so Keep is better</text>
      <text x="810" y="196" text-anchor="middle" font-size="14">The 5 points are not transferred</text>
    </g>
  </g>
</svg>
