<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 280" role="img" aria-labelledby="title desc">
  <title id="title">Classroom Trust by card</title>
  <desc id="desc">Seven pairs. Trust was 16 of 28 on the aligned card, 18 of 28 on the misaligned card without a forfeit, and 26 of 28 on the misaligned card with a forfeit of 5. The model predicts 28 of 28, 0 of 28, and 28 of 28.</desc>
  <rect width="860" height="280" fill="#F5F7FA"/>
  <g font-family="Georgia, serif" fill="#111111">
    <text x="430" y="32" text-anchor="middle" font-size="16" font-weight="700">Trust choices in seven pairs, 28 rounds on each card</text>
    <line x1="70" y1="210" x2="820" y2="210" stroke="#111111" stroke-width="1.2"/>
    <g>
      <rect x="110" y="122" width="46" height="88" fill="#0072B2"/>
      <text x="133" y="114" text-anchor="middle" font-size="13" font-weight="700">16/28</text>
      <rect x="164" y="50" width="46" height="160" fill="#D9D9D9" stroke="#111111"/>
      <text x="187" y="42" text-anchor="middle" font-size="13">28/28</text>
      <text x="157" y="234" text-anchor="middle" font-size="13">Aligned</text>
      <text x="157" y="252" text-anchor="middle" font-size="12">model: all Trust</text>
    </g>
    <g>
      <rect x="360" y="110" width="46" height="100" fill="#0072B2"/>
      <text x="383" y="102" text-anchor="middle" font-size="13" font-weight="700">18/28</text>
      <rect x="414" y="206" width="46" height="4" fill="#D9D9D9" stroke="#111111"/>
      <text x="437" y="200" text-anchor="middle" font-size="13">0/28</text>
      <text x="407" y="234" text-anchor="middle" font-size="13">Misaligned</text>
      <text x="407" y="252" text-anchor="middle" font-size="12">model: no Trust</text>
    </g>
    <g>
      <rect x="610" y="62" width="46" height="148" fill="#E69F00"/>
      <text x="633" y="54" text-anchor="middle" font-size="13" font-weight="700">26/28</text>
      <rect x="664" y="50" width="46" height="160" fill="#D9D9D9" stroke="#111111"/>
      <text x="687" y="42" text-anchor="middle" font-size="13">28/28</text>
      <text x="657" y="234" text-anchor="middle" font-size="13">Forfeit 5</text>
      <text x="657" y="252" text-anchor="middle" font-size="12">model: all Trust</text>
    </g>
    <rect x="70" y="262" width="14" height="10" fill="#0072B2"/>
    <text x="90" y="272" font-size="12">Observed Trust, blue or gold</text>
    <rect x="280" y="262" width="14" height="10" fill="#D9D9D9" stroke="#111111"/>
    <text x="300" y="272" font-size="12">Model prediction, gray</text>
  </g>
</svg>
